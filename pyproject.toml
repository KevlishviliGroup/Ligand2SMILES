[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Ligand2SMILES"
version = "0.1.0"
description = "A tool for converting ligand names to SMILES notation"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Pedro Augusto Durao Rodrigues", email = "pedroaugustoduraorodrigues@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]


[project.urls]
Homepage = "https://github.com/KevlishviliGroup/Ligand2SMILES"
Issues = "https://github.com/KevlishviliGroup/Ligand2SMILES/issues"

[tool.setuptools.packages.find]
where = ["src"]
